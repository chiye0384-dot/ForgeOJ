# Independent package. Requires private files; no public fixture constants or dev profile.
name: ${COMPOSE_PROJECT_NAME:?set owned project name}
x-runtime: &runtime
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
x-api-env: &api-env
  SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forgeoj
  SPRING_DATASOURCE_USERNAME: forgeoj_api
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: forgeoj
  SPRING_RABBITMQ_VIRTUAL_HOST: /forgeoj
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  FORGEOJ_AUTH_MAIL_APP_URL: https://${FORGEOJ_DOMAIN:?set domain}${FORGEOJ_HTTPS_SUFFIX:-}
  FORGEOJ_AUTH_MAIL_MODE: ${FORGEOJ_MAIL_MODE:-disabled}
  FORGEOJ_AUTH_MAIL_SMTP_HOST: ${FORGEOJ_SMTP_HOST:-}
  FORGEOJ_AUTH_MAIL_SMTP_PORT: ${FORGEOJ_SMTP_PORT:-587}
  FORGEOJ_AUTH_MAIL_SMTP_TLS: ${FORGEOJ_SMTP_TLS:-starttls}
  FORGEOJ_AUTH_MAIL_SMTP_FROM: ${FORGEOJ_SMTP_FROM:-}
  FORGEOJ_AUTH_MAIL_SMTP_USERNAME: ${FORGEOJ_SMTP_USERNAME:-}
  FORGEOJ_OUTBOX_PUBLISHER_ENABLED: "true"
  FORGEOJ_REDIS_ENABLED: "true"
  FORGEOJ_REDIS_HOST: redis
  FORGEOJ_SEARCH_ENABLED: "true"
  FORGEOJ_SEARCH_URL: https://search:9200
  FORGEOJ_SEARCH_USERNAME: forgeoj_search
  JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/search-trust.p12 -Djavax.net.ssl.trustStorePassword=changeit
  FORGEOJ_MONITORING_ENABLED: "true"
  FORGEOJ_MONITORING_BIND: 0.0.0.0
  FORGEOJ_MONITORING_ALLOW_PRIVATE_NETWORK_BIND: "true"
services:
  mysql:
    platform: linux/amd64
    image: container-registry.oracle.com/mysql/community-server:8.4.12@sha256:7dcc4add9183664de3a214daf85a50c3ba6cccfd7534f700b6561bf5b41885be
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
    entrypoint: [bash, /opt/forgeoj/mysql-entrypoint.sh]
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --default-time-zone=+00:00]
    environment: {MYSQL_DATABASE: forgeoj}
    secrets: [root-password, migrator-password, api-password, worker-password]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-entrypoint.sh:/opt/forgeoj/mysql-entrypoint.sh:ro
      - ./scripts/mysql-users.sh:/docker-entrypoint-initdb.d/01-users.sh:ro
      - ./scripts/create-users.sh:/opt/forgeoj/create-users.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h127.0.0.1 --silent']
      interval: 5s
      timeout: 3s
      retries: 60
  migrate:
    <<: *runtime
    restart: "no"
    profiles: [maintenance]
    image: ${FORGEOJ_API_IMAGE:?build and pin API image}
    entrypoint: [java, -cp, '/app/migration:/app/classes:/app/lib/*', Migrate]
    environment: {SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/forgeoj'}
    mem_limit: 512m
    tmpfs: ["/tmp:size=64m,mode=1777"]
    secrets: [migrator-password]
    networks: [database]
    depends_on: {mysql: {condition: service_healthy}}
  admin:
    <<: *runtime
    restart: "no"
    profiles: [maintenance]
    image: ${FORGEOJ_API_IMAGE}
    entrypoint: [sh, /app/admin.sh]
    environment: {SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/forgeoj'}
    tmpfs: ["/tmp:size=32m,mode=1777"]
    secrets: [migrator-password]
    networks: [database]
  search-setup:
    <<: *runtime
    restart: "no"
    profiles: [maintenance]
    image: ${FORGEOJ_API_IMAGE}
    entrypoint: [bash, /opt/forgeoj/search-setup.sh]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    secrets: [search-admin-password, search-password]
    volumes:
      - ./scripts/search-setup.sh:/opt/forgeoj/search-setup.sh:ro
      - ${FORGEOJ_PRIVATE_DIR}/search/search.crt:/run/search.crt:ro
    networks: [searching]
  rabbitmq:
    platform: linux/amd64
    image: rabbitmq:4.3.6-management@sha256:cdf40d8cb363d145e377ed88d59696a42386ffe54b30125f10eb128b862eea95
    user: "999:999"
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [sh, /opt/forgeoj/rabbitmq.sh]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    secrets: [rabbit-password]
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./scripts/rabbitmq.sh:/opt/forgeoj/rabbitmq.sh:ro
      - ./monitoring/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [messaging]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    <<: *runtime
    image: redis:7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    user: "999:999"
    mem_limit: 192m
    entrypoint: [sh, /opt/forgeoj/redis.sh]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    secrets: [redis-password]
    volumes: [./scripts/redis.sh:/opt/forgeoj/redis.sh:ro]
    networks: [cache]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis-password) redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  search:
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3@sha256:f456578fc2a620a8a4f4c21d070fff1f6070345adb2be5e5626b65be72aea350
    restart: unless-stopped
    entrypoint: [/bin/tini, --, /bin/bash, /opt/forgeoj/search-entrypoint.sh]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/search.crt
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/search.key
      xpack.license.self_generated.type: basic
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    secrets: [search-admin-password]
    volumes:
      - search-data:/usr/share/elasticsearch/data
      - ./scripts/search-entrypoint.sh:/opt/forgeoj/search-entrypoint.sh:ro
      - ${FORGEOJ_PRIVATE_DIR:?private directory}/search/search.crt:/usr/share/elasticsearch/config/certs/search.crt:ro
      - ${FORGEOJ_PRIVATE_DIR}/search/search.key:/usr/share/elasticsearch/config/certs/search.key:ro
    networks: [searching]
    healthcheck:
      test: [CMD-SHELL, 'curl -s --cacert /usr/share/elasticsearch/config/certs/search.crt -o /dev/null -w "%{http_code}" https://localhost:9200/ | grep -q 401']
      interval: 5s
      timeout: 3s
      retries: 40
  api:
    <<: *runtime
    image: ${FORGEOJ_API_IMAGE}
    mem_limit: 768m
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment: *api-env
    secrets:
      - {source: api-password, target: spring.datasource.password}
      - {source: rabbit-password, target: spring.rabbitmq.password}
      - {source: redis-password, target: spring.data.redis.password}
      - {source: jwt-secret, target: forgeoj.auth.jwt.secret}
      - {source: admin-jwt-secret, target: forgeoj.admin.jwt.secret}
      - {source: search-password, target: forgeoj.search.password}
      - {source: monitoring-token, target: forgeoj.monitoring.token}
      - {source: smtp-password, target: forgeoj.auth.mail.smtp.password}
    volumes:
      - ${FORGEOJ_PRIVATE_DIR}/search/trust.p12:/run/search-trust.p12:ro
    networks: [ingress, database, messaging, cache, searching, telemetry, outbound]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      search: {condition: service_healthy}
    healthcheck:
      test: [CMD, sh, /app/health.sh, api]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
  worker:
    <<: *runtime
    image: ${FORGEOJ_WORKER_IMAGE:?build and pin Worker image}
    mem_limit: 768m
    group_add: ["${FORGEOJ_DOCKER_SOCKET_GID:?set actual socket GID}"]
    tmpfs: ["/tmp:size=96m,mode=1777"]
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forgeoj
      SPRING_DATASOURCE_USERNAME: forgeoj_worker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: forgeoj
      SPRING_RABBITMQ_VIRTUAL_HOST: /forgeoj
      FORGEOJ_WORKER_CONSUMER_ENABLED: "true"
      FORGEOJ_WORKER_SANDBOX_ENABLED: "true"
      FORGEOJ_WORKER_RECOVERY_ENABLED: "true"
      FORGEOJ_WORKER_INSTANCE_ID: ${COMPOSE_PROJECT_NAME}
      FORGEOJ_MONITORING_ENABLED: "true"
      FORGEOJ_MONITORING_BIND: 0.0.0.0
      FORGEOJ_MONITORING_ALLOW_PRIVATE_NETWORK_BIND: "true"
    secrets:
      - {source: worker-password, target: spring.datasource.password}
      - {source: rabbit-password, target: spring.rabbitmq.password}
      - {source: monitoring-token, target: forgeoj.monitoring.token}
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    networks: [database, messaging, telemetry]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, sh, /app/health.sh, worker]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
  web:
    <<: *runtime
    image: ${FORGEOJ_WEB_IMAGE:?build and pin web image}
    mem_limit: 128m
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    environment:
      FORGEOJ_DOMAIN: ${FORGEOJ_DOMAIN}
      FORGEOJ_HTTPS_PORT: ${FORGEOJ_HTTPS_PORT:-443}
      FORGEOJ_HTTPS_SUFFIX: ${FORGEOJ_HTTPS_SUFFIX:-}
      NGINX_ENVSUBST_FILTER: ^FORGEOJ_
    tmpfs: ["/tmp:size=32m,mode=1777", "/etc/nginx/conf.d:size=1m,mode=0755", "/var/cache/nginx:size=16m,mode=0755"]
    volumes:
      - ${FORGEOJ_PRIVATE_DIR}/tls/fullchain.pem:/run/tls/fullchain.pem:ro
      - ${FORGEOJ_PRIVATE_DIR}/tls/privkey.pem:/run/tls/privkey.pem:ro
    ports:
      - ${FORGEOJ_BIND_IP:-127.0.0.1}:${FORGEOJ_HTTP_PORT:-80}:80
      - ${FORGEOJ_BIND_IP:-127.0.0.1}:${FORGEOJ_HTTPS_PORT:-443}:443
    networks: [edge, ingress]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, sh, /usr/local/bin/forgeoj-health.sh]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 10s
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    user: "65534:65534"
    mem_limit: 256m
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=28d, --storage.tsdb.retention.size=2GB]
    secrets: [monitoring-token]
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [telemetry, messaging]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    user: "472:472"
    mem_limit: 384m
    tmpfs: ["/tmp:size=32m,mode=1777", "/var/log/grafana:size=16m,mode=1777"]
    environment:
      GF_SECURITY_ADMIN_USER: forgeoj_monitor_admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana-key
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ALLOW_EMBEDDING: "false"
    secrets: [grafana-password, grafana-key]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/forgeoj.yml:ro
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/forgeoj.yml:ro
      - ./monitoring/forgeoj.json:/etc/grafana/forgeoj-dashboards/forgeoj.json:ro
    ports: [127.0.0.1:3000:3000]
    networks: [telemetry, maintenance]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
networks:
  edge: {}
  ingress: {internal: true}
  database: {internal: true}
  messaging: {internal: true}
  cache: {internal: true}
  searching: {internal: true}
  telemetry: {internal: true}
  outbound: {}
  # Host-loopback publication needs a non-internal bridge; only Grafana joins it.
  maintenance: {}
volumes:
  mysql-data: {}
  rabbit-data: {}
  search-data: {}
  prometheus-data: {}
  grafana-data: {}
secrets:
  root-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/root-password'}
  migrator-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/migrator-password'}
  api-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/api-password'}
  worker-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/worker-password'}
  rabbit-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/rabbit-password'}
  redis-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/redis-password'}
  jwt-secret: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/jwt-secret'}
  admin-jwt-secret: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/admin-jwt-secret'}
  search-admin-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/search-admin-password'}
  search-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/search-password'}
  monitoring-token: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/monitoring-token'}
  smtp-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/smtp-password'}
  grafana-password: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/grafana-password'}
  grafana-key: {file: '${FORGEOJ_PRIVATE_DIR}/secrets/grafana-key'}
