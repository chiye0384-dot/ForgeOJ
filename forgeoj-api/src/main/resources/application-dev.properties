spring.datasource.url=${FORGEOJ_DB_URL:jdbc:mysql://127.0.0.1:3306/forgeoj}
spring.datasource.username=forgeoj_api
spring.datasource.password=${FORGEOJ_API_DB_PASSWORD}

spring.flyway.url=${FORGEOJ_DB_URL:jdbc:mysql://127.0.0.1:3306/forgeoj}
spring.flyway.user=forgeoj_migrator
spring.flyway.password=${FORGEOJ_MIGRATOR_PASSWORD}
spring.flyway.locations=classpath:db/migration,classpath:db/devdata

spring.rabbitmq.host=${FORGEOJ_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:forgeoj}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.virtual-host=/forgeoj

forgeoj.outbox.publisher.enabled=true
forgeoj.outbox.publisher.batch-size=20
forgeoj.outbox.publisher.fixed-delay-ms=1000
forgeoj.outbox.publisher.confirm-timeout-ms=5000
