spring.application.name=forgeoj-api
logging.structured.format.console=logstash
logging.structured.format.file=logstash
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
mybatis.configuration.map-underscore-to-camel-case=true
# Production requires a private, random secret; never use the public test key.
forgeoj.auth.jwt.secret=${FORGEOJ_AUTH_JWT_SECRET:}
forgeoj.admin.jwt.secret=${FORGEOJ_ADMIN_JWT_SECRET:}
forgeoj.admin.cookie.secure=${FORGEOJ_ADMIN_COOKIE_SECURE:true}
forgeoj.auth.cookie.secure=true
forgeoj.auth.mail.mode=${FORGEOJ_AUTH_MAIL_MODE:disabled}
forgeoj.auth.mail.app-url=${FORGEOJ_AUTH_MAIL_APP_URL:http://localhost:5173}
# SMTP is opt-in and always requires TLS. Credentials belong in the API environment.
forgeoj.auth.mail.smtp.host=${FORGEOJ_AUTH_MAIL_SMTP_HOST:}
forgeoj.auth.mail.smtp.port=${FORGEOJ_AUTH_MAIL_SMTP_PORT:587}
forgeoj.auth.mail.smtp.tls=${FORGEOJ_AUTH_MAIL_SMTP_TLS:starttls}
forgeoj.auth.mail.smtp.from=${FORGEOJ_AUTH_MAIL_SMTP_FROM:}
forgeoj.auth.mail.smtp.username=${FORGEOJ_AUTH_MAIL_SMTP_USERNAME:}
forgeoj.auth.mail.smtp.password=${FORGEOJ_AUTH_MAIL_SMTP_PASSWORD:}
forgeoj.auth.mail.smtp.connect-timeout-ms=${FORGEOJ_AUTH_MAIL_SMTP_CONNECT_TIMEOUT_MS:5000}
forgeoj.auth.mail.smtp.read-timeout-ms=${FORGEOJ_AUTH_MAIL_SMTP_READ_TIMEOUT_MS:5000}
forgeoj.auth.mail.smtp.write-timeout-ms=${FORGEOJ_AUTH_MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
forgeoj.outbox.publisher.max-attempts=5
forgeoj.outbox.publisher.base-delay-seconds=1
forgeoj.outbox.publisher.max-delay-seconds=60
# Small-scale, same-process notifications; MySQL and owner-only GET remain authoritative.
forgeoj.notifications.fixed-delay-ms=500
forgeoj.notifications.max-connections=20
forgeoj.notifications.max-connections-per-user=2
# Optional Redis: never bypass MySQL authorization, quotas or durable idempotency.
forgeoj.redis.enabled=${FORGEOJ_REDIS_ENABLED:false}
forgeoj.redis.cooldown-ms=2000
spring.data.redis.host=${FORGEOJ_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${FORGEOJ_REDIS_PORT:6379}
spring.data.redis.username=${FORGEOJ_REDIS_USERNAME:}
spring.data.redis.password=${FORGEOJ_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=250ms
spring.data.redis.repositories.enabled=false
# Optional public search. Credentials come from local environment, never from Worker config.
forgeoj.search.enabled=${FORGEOJ_SEARCH_ENABLED:false}
forgeoj.search.url=${FORGEOJ_SEARCH_URL:https://localhost:9200}
forgeoj.search.username=${FORGEOJ_SEARCH_USERNAME:}
forgeoj.search.password=${FORGEOJ_SEARCH_PASSWORD:}
forgeoj.search.allow-loopback-http=${FORGEOJ_SEARCH_ALLOW_LOOPBACK_HTTP:false}
