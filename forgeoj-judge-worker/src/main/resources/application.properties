spring.application.name=forgeoj-judge-worker
spring.main.web-application-type=none
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
forgeoj.worker.consumer.enabled=false
forgeoj.worker.sandbox.enabled=false
forgeoj.worker.lease-duration-seconds=30
forgeoj.worker.retry.base-delay-seconds=5
forgeoj.worker.retry.max-delay-seconds=60
forgeoj.worker.docker.executable=docker
