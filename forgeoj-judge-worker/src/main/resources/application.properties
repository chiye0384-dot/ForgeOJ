spring.application.name=forgeoj-judge-worker
# Dedicated aggregate telemetry; never a public Worker web application.
forgeoj.monitoring.enabled=${FORGEOJ_MONITORING_ENABLED:false}
forgeoj.monitoring.bind=${FORGEOJ_MONITORING_BIND:127.0.0.1}
forgeoj.monitoring.port=${FORGEOJ_MONITORING_PORT:9092}
forgeoj.monitoring.token=${FORGEOJ_MONITORING_TOKEN:}
forgeoj.monitoring.allow-private-network-bind=${FORGEOJ_MONITORING_ALLOW_PRIVATE_NETWORK_BIND:false}
logging.structured.format.console=logstash
logging.structured.format.file=logstash
spring.main.web-application-type=none
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
forgeoj.worker.consumer.enabled=false
forgeoj.worker.sandbox.enabled=false
forgeoj.worker.sandbox.cleanup-delay-ms=5000
forgeoj.worker.lease-duration-seconds=30
forgeoj.worker.heartbeat-interval-millis=5000
forgeoj.worker.recovery.enabled=false
forgeoj.worker.recovery.batch-size=20
forgeoj.worker.recovery.fixed-delay-ms=5000
forgeoj.worker.retry.base-delay-seconds=5
forgeoj.worker.retry.max-delay-seconds=60
forgeoj.worker.quota-retry-delay-seconds=5
forgeoj.worker.docker.executable=docker
