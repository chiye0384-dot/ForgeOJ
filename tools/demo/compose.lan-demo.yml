# Overlay for an owned disposable replay; not a production deployment.
services:
  frontend:
    entrypoint: [node, /source/tools/demo/serve-lan-demo.mjs]
    environment:
      FORGEOJ_DEMO_HOST: ${FORGEOJ_DEMO_LAN_IP:?set specific Wi-Fi IPv4}:${FORGEOJ_DEMO_PORT:-8088}
    volumes:
      - ${FORGEOJ_E2E_ARTIFACTS:?set accepted build}/frontend-dist:/site:ro
    ports: !override
      - ${FORGEOJ_DEMO_LAN_IP}:${FORGEOJ_DEMO_PORT:-8088}:5173
