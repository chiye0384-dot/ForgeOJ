# Fixed, PUBLIC TEST credentials. Only a unique disposable project may run this file.
x-api-env: &api-env
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forgeoj
  SPRING_DATASOURCE_USERNAME: forgeoj_api
  SPRING_DATASOURCE_PASSWORD: m1-e2e-api-test-secret
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: forgeoj
  SPRING_RABBITMQ_PASSWORD: m1-e2e-rabbit-test-secret
  SPRING_RABBITMQ_VIRTUAL_HOST: /forgeoj
  FORGEOJ_OUTBOX_PUBLISHER_ENABLED: "true"
  FORGEOJ_OUTBOX_PUBLISHER_FIXED_DELAY_MS: "200"
  # Public fixture key and loopback-only development mail, never production configuration.
  FORGEOJ_AUTH_JWT_SECRET: m2-public-fixture-signing-key-only-2026
  FORGEOJ_AUTH_COOKIE_SECURE: "false"
  SPRING_PROFILES_ACTIVE: test
  FORGEOJ_AUTH_MAIL_MODE: local
  FORGEOJ_AUTH_MAIL_APP_URL: ${FORGEOJ_E2E_MAIL_APP_URL:-http://localhost:5173}

x-api-base: &api-base
  image: eclipse-temurin:21.0.12_8-jdk-jammy@sha256:c7d5863b5dd8f26b90c64f1d80cc2b0e5a5e4642f8db9955a370d348edd8f438
  platform: linux/amd64
  user: "65534:65534"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  volumes:
    - ${FORGEOJ_E2E_ARTIFACTS:?set test artifact directory}/forgeoj-api/forgeoj-api-0.0.1-SNAPSHOT.jar:/app/api.jar:ro
  command: [java, -Xmx256m, -jar, /app/api.jar]
  depends_on:
    mysql: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
  healthcheck:
    test: [CMD, curl, --fail, --silent, http://localhost:8080/api/v1/auth/session]
    interval: 2s
    timeout: 3s
    retries: 60

services:
  mysql:
    image: container-registry.oracle.com/mysql/community-server:8.4.12@sha256:7dcc4add9183664de3a214daf85a50c3ba6cccfd7534f700b6561bf5b41885be
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: m1-e2e-root-test-secret
      MYSQL_DATABASE: forgeoj
      FORGEOJ_MIGRATOR_PASSWORD: m1-e2e-migrator-test-secret
      FORGEOJ_API_DB_PASSWORD: m1-e2e-api-test-secret
      FORGEOJ_WORKER_DB_PASSWORD: m1-e2e-worker-test-secret
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --default-time-zone=+00:00]
    volumes:
      - mysql-data:/var/lib/mysql
      - ${FORGEOJ_E2E_SOURCE:?set test source directory}/deploy/mysql/init/01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h127.0.0.1 -uroot --password="$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 2s
      timeout: 3s
      retries: 90
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:cdf40d8cb363d145e377ed88d59696a42386ffe54b30125f10eb128b862eea95
    platform: linux/amd64
    environment:
      RABBITMQ_DEFAULT_USER: forgeoj
      RABBITMQ_DEFAULT_PASS: m1-e2e-rabbit-test-secret
      RABBITMQ_DEFAULT_VHOST: /forgeoj
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 2s
      timeout: 5s
      retries: 60
  bootstrap:
    <<: *api-base
    profiles: [bootstrap]
    # Existing dev Flyway entry point; removed before the runtime API is started.
    environment:
      <<: *api-env
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "true"
      FORGEOJ_DB_URL: jdbc:mysql://mysql:3306/forgeoj
      FORGEOJ_API_DB_PASSWORD: m1-e2e-api-test-secret
      FORGEOJ_MIGRATOR_PASSWORD: m1-e2e-migrator-test-secret
      FORGEOJ_RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_PASS: m1-e2e-rabbit-test-secret
      FORGEOJ_OUTBOX_PUBLISHER_ENABLED: "false"
  api:
    <<: *api-base
    environment: *api-env
  mailbox:
    # This disposable bridge alone shares API networking to reach its loopback mailbox.
    # Only the host-loopback fixture Vite exposes /dev-mail; ordinary API routes stay unchanged.
    image: node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c
    platform: linux/amd64
    user: "65534:65534"
    read_only: true
    network_mode: service:api
    volumes:
      - ${FORGEOJ_E2E_SOURCE}/tools/validation/account-mail-bridge.mjs:/mail-bridge.mjs:ro
    command: [node, /mail-bridge.mjs]
    depends_on:
      api: {condition: service_healthy}
  worker:
    profiles: [worker]
    image: ${FORGEOJ_E2E_PROJECT:?set unique test project}-worker
    build: {context: ., dockerfile: Dockerfile.replay-worker}
    platform: linux/amd64
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forgeoj
      SPRING_DATASOURCE_USERNAME: forgeoj_worker
      SPRING_DATASOURCE_PASSWORD: m1-e2e-worker-test-secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: forgeoj
      SPRING_RABBITMQ_PASSWORD: m1-e2e-rabbit-test-secret
      SPRING_RABBITMQ_VIRTUAL_HOST: /forgeoj
      FORGEOJ_WORKER_CONSUMER_ENABLED: "true"
      FORGEOJ_WORKER_SANDBOX_ENABLED: "true"
      FORGEOJ_WORKER_RECOVERY_ENABLED: "true"
      FORGEOJ_WORKER_INSTANCE_ID: ${FORGEOJ_E2E_PROJECT}
      FORGEOJ_WORKER_LEASE_DURATION_SECONDS: "12"
      FORGEOJ_WORKER_HEARTBEAT_INTERVAL_MILLIS: "1000"
      FORGEOJ_WORKER_RECOVERY_FIXED_DELAY_MS: "500"
      FORGEOJ_WORKER_RETRY_BASE_DELAY_SECONDS: "1"
      FORGEOJ_WORKER_RETRY_MAX_DELAY_SECONDS: "1"
    volumes:
      - ${FORGEOJ_E2E_ARTIFACTS}/forgeoj-judge-worker/forgeoj-judge-worker-0.0.1-SNAPSHOT.jar:/app/worker.jar:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api: {condition: service_healthy}
  frontend:
    image: node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c
    platform: linux/amd64
    entrypoint: [/bin/bash, /source/tools/validation/start-replay-frontend.sh]
    volumes:
      - ${FORGEOJ_E2E_SOURCE}:/source:ro
      - ${FORGEOJ_E2E_REPORTS:?set test report directory}:/reports
    ports: ["127.0.0.1::5173", "127.0.0.1::5174"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173/api/v1/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  mysql-data:
  rabbit-data:
